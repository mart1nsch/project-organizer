<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Project Organizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="header-left" style="gap:16px">
                <a href="/" class="back-btn">← My Projects</a>
                <span class="header-project-name" id="headerProjectName"></span>
            </div>
            <div class="hero-actions">
                <a class="btn btn-secondary btn-sm btn-icon-only" id="githubBtn" href="#" target="_blank" rel="noopener noreferrer" style="display:none" title="Open GitHub repository">
                    <img src="/static/img/github.png" alt="GitHub" width="18" height="18" class="github-icon">
                </a>
                <button class="btn btn-secondary btn-sm" id="editProjectBtn">Edit</button>
            </div>
        </div>
    </header>

    <main class="main" id="mainContent">
        <div id="loadingState" style="padding:60px;text-align:center;color:var(--text-muted)">Loading...</div>

        <div id="pageContent" style="display:none">
            <!-- Project hero -->
            <div class="project-hero">
                <div class="hero-top">
                    <span class="status-badge" id="heroStatus"></span>
                </div>
                <h1 class="project-name" id="heroName"></h1>
                <p class="project-desc" id="heroDesc" style="display:none"></p>
                <div class="hero-tags" id="heroTags" style="display:none"></div>
            </div>

            <!-- Tasks + Milestones -->
            <div class="content-grid">

                <!-- Tasks -->
                <section class="section-card">
                    <div class="section-head">
                        <h2>Tasks <span class="count-badge" id="taskCount">0</span></h2>
                        <button class="btn btn-secondary btn-sm" id="addTaskBtn">+ Add</button>
                    </div>
                    <div class="add-form hidden" id="addTaskForm">
                        <input type="text" id="taskTitleInput" placeholder="What needs to be done?" maxlength="500">
                        <textarea id="taskNotesInput" placeholder="Notes (optional)" rows="2"></textarea>
                        <div class="form-actions">
                            <button class="btn btn-secondary btn-sm" id="cancelTaskBtn">Cancel</button>
                            <button class="btn btn-primary btn-sm" id="saveTaskBtn">Add Task</button>
                        </div>
                    </div>
                    <ul class="item-list" id="taskList"></ul>
                </section>

                <!-- Milestones -->
                <section class="section-card">
                    <div class="section-head">
                        <h2>Milestones <span class="count-badge" id="milestoneCount">0</span></h2>
                        <button class="btn btn-secondary btn-sm" id="addMilestoneBtn">+ Add</button>
                    </div>
                    <div class="add-form hidden" id="addMilestoneForm">
                        <input type="text" id="milestoneTitleInput" placeholder="Milestone name" maxlength="500">
                        <textarea id="milestoneDescInput" placeholder="Description (optional)" rows="2"></textarea>
                        <div class="form-actions">
                            <button class="btn btn-secondary btn-sm" id="cancelMilestoneBtn">Cancel</button>
                            <button class="btn btn-primary btn-sm" id="saveMilestoneBtn">Add Milestone</button>
                        </div>
                    </div>
                    <ul class="item-list" id="milestoneList"></ul>
                </section>

            </div>
        </div>
    </main>

    <!-- Edit project modal -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="modal">
        <div class="modal-header">
            <h2>Edit Project</h2>
            <button class="modal-close" id="modalCloseBtn">&#x2715;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="projectName">Name <span class="required">*</span></label>
                <input type="text" id="projectName" maxlength="200" autocomplete="off">
                <span class="field-error" id="nameError">Name is required</span>
            </div>
            <div class="form-group">
                <label for="projectDescription">Description</label>
                <textarea id="projectDescription" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="projectStatus">Status</label>
                <select id="projectStatus">
                    <option value="idea">Idea</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="paused">Paused</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tags <span class="hint">— press Enter or comma to add</span></label>
                <div class="tag-input-container" id="tagInputContainer">
                    <input type="text" class="tag-text-input" id="tagInput" placeholder="Add a tag...">
                </div>
            </div>
            <div class="form-group">
                <label for="projectGithubUrl">GitHub Repository URL</label>
                <input type="url" id="projectGithubUrl" placeholder="https://github.com/user/repo" autocomplete="off">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary btn-sm btn-danger-ghost" id="deleteProjectBtn">Delete</button>
            <div class="modal-footer-delete">
                <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Delete project confirmation -->
    <div class="modal-overlay" id="deleteOverlay"></div>
    <div class="modal modal-sm" id="deleteModal">
        <div class="modal-header">
            <h2>Delete Project</h2>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete <strong id="deleteProjectName"></strong>? All tasks and milestones will also be deleted. This cannot be undone.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>

    <!-- Priority dropdown -->
    <div class="priority-dropdown" id="priorityDropdown" style="display:none">
        <button class="priority-option" data-priority="high"><span class="pd-dot p-high"></span>High</button>
        <button class="priority-option" data-priority="medium"><span class="pd-dot p-medium"></span>Medium</button>
        <button class="priority-option" data-priority="low"><span class="pd-dot p-low"></span>Low</button>
        <button class="priority-option" data-priority="none"><span class="pd-dot p-none"></span>None</button>
    </div>

    <script src="/static/js/project.js"></script>
</body>
</html>
